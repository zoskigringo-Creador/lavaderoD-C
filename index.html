<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>D&C BAEZ AutoSpa</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
        
        .hidden-section { display: none !important; }
        .safe-pb { padding-bottom: env(safe-area-inset-bottom); }
        
        /* Asegurar que los botones sean fáciles de tocar */
        button, .btn-tipo, .servicio-card, .adicional-card { 
            touch-action: manipulation; 
            cursor: pointer; 
            user-select: none; 
            -webkit-user-select: none; 
            -webkit-tap-highlight-color: rgba(0,0,0,0);
        }
        
        /* Animación de carga */
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 3px solid #fff; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Estilo para las burbujas sutiles en el fondo del app */
        .bg-bubbles {
            background-color: #f1f5f9;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="bg-bubbles min-h-screen relative overflow-x-hidden selection:bg-cyan-200 selection:text-cyan-900">

    <!-- APP PRINCIPAL (Directo, sin pantalla de bienvenida) -->
    <div id="appContainer" class="opacity-100 transition-opacity duration-700">
        
        <!-- HEADER -->
        <header class="bg-blue-900 text-white shadow-xl sticky top-0 z-40 safe-pb">
            <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="border border-white/30 p-1 px-2 font-black text-base md:text-lg bg-blue-800 tracking-tighter shadow-inner">D&C</div>
                    <div class="leading-tight">
                        <p class="text-[10px] md:text-xs text-blue-300 font-bold uppercase tracking-widest">Sistema</p>
                        <p class="text-xs md:text-sm font-bold text-white">BAEZ AutoSpa</p>
                    </div>
                </div>
                
                <div class="flex gap-2 bg-blue-950/50 p-1 rounded-lg">
                    <button onclick="switchView('ingreso')" id="btnIngreso" class="px-3 py-2 rounded-md text-xs md:text-sm font-bold transition-all bg-cyan-500 text-white shadow-lg flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        <span class="hidden sm:inline">Ingreso</span>
                    </button>
                    <button onclick="switchView('admin')" id="btnAdmin" class="px-3 py-2 rounded-md text-xs md:text-sm font-bold transition-all text-blue-300 hover:text-white hover:bg-white/10 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                        <span class="hidden sm:inline">Auditoría</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- VISTA: INGRESO -->
        <div id="viewIngreso" class="max-w-4xl mx-auto p-4 pb-32 md:pb-8 animate-fade-in">
            <!-- Toast Notificación -->
            <div id="toast" class="hidden fixed top-20 right-4 left-4 md:left-auto md:w-auto bg-emerald-600 text-white px-6 py-4 rounded-xl shadow-2xl z-50 flex items-center justify-center md:justify-start gap-3 transform translate-y-[-150%] transition-transform duration-300 pointer-events-none">
                <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                <span id="toastMsg" class="font-bold text-sm">Guardado correctamente</span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
                <!-- PANEL 1: DATOS -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 md:p-6">
                    <h3 class="text-blue-900 font-bold text-base md:text-lg mb-4 flex items-center gap-2 uppercase tracking-wide">
                        <span class="w-1.5 h-6 bg-cyan-500 rounded-full"></span>
                        Datos del Vehículo
                    </h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1 tracking-wider">Número de Chapa</label>
                            <input type="text" id="inputChapa" placeholder="AAA 123" class="w-full text-3xl md:text-4xl font-black uppercase p-3 md:p-4 border-2 border-slate-200 rounded-xl focus:border-cyan-500 focus:outline-none focus:ring-4 focus:ring-cyan-50 transition-all bg-slate-50 placeholder-slate-300 text-center tracking-widest text-slate-800">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-2 tracking-wider">Tipo de Vehículo</label>
                            <div class="grid grid-cols-2 gap-2">
                                <button type="button" onclick="selectTipo('Camioneta')" class="btn-tipo p-3 rounded-lg border-2 border-slate-200 font-bold text-sm text-slate-500 hover:bg-slate-50 active:scale-95 transition-all active-tipo" data-value="Camioneta">Camioneta</button>
                                <button type="button" onclick="selectTipo('Auto')" class="btn-tipo p-3 rounded-lg border-2 border-slate-200 font-bold text-sm text-slate-500 hover:bg-slate-50 active:scale-95 transition-all" data-value="Auto">Auto</button>
                                <button type="button" onclick="selectTipo('Moto')" class="btn-tipo p-3 rounded-lg border-2 border-slate-200 font-bold text-sm text-slate-500 hover:bg-slate-50 active:scale-95 transition-all" data-value="Moto">Moto</button>
                                <button type="button" onclick="selectTipo('Camion')" class="btn-tipo p-3 rounded-lg border-2 border-slate-200 font-bold text-sm text-slate-500 hover:bg-slate-50 active:scale-95 transition-all" data-value="Camion">Camión</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- PANEL 2: SERVICIOS -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 md:p-6">
                    <h3 class="text-blue-900 font-bold text-base md:text-lg mb-4 flex items-center gap-2 uppercase tracking-wide">
                        <span class="w-1.5 h-6 bg-blue-600 rounded-full"></span>
                        Servicios
                    </h3>
                    <div id="serviciosContainer" class="space-y-2.5"></div>
                </div>
            </div>

            <!-- ADICIONALES -->
            <div class="mt-4 md:mt-6 bg-white rounded-2xl shadow-sm border border-slate-200 p-5 md:p-6">
                <h3 class="text-slate-400 font-bold text-xs uppercase mb-3 tracking-widest">Adicionales (Opcional)</h3>
                <div id="adicionalesContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5"></div>
            </div>

            <!-- FOOTER FLOTANTE -->
            <div class="fixed bottom-0 left-0 w-full bg-white/95 backdrop-blur-md shadow-[0_-5px_25px_rgba(0,0,0,0.1)] p-4 border-t border-slate-100 z-30 safe-pb">
                <div class="max-w-4xl mx-auto flex flex-row items-center justify-between gap-4">
                    <div class="flex flex-col">
                        <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Total a Cobrar</span>
                        <span id="totalDisplay" class="text-2xl md:text-3xl font-black text-blue-900 leading-none">0 Gs</span>
                    </div>
                    <button onclick="guardarRegistro()" id="btnGuardar" class="flex-1 max-w-xs bg-gradient-to-r from-blue-700 to-cyan-600 hover:from-blue-800 hover:to-cyan-700 text-white py-3.5 px-6 rounded-xl font-bold shadow-lg shadow-cyan-500/20 transform active:scale-95 transition-all flex items-center justify-center gap-2">
                        <span id="btnText" class="tracking-wide text-sm md:text-base">REGISTRAR</span>
                        <div id="btnLoader" class="spinner hidden"></div>
                    </button>
                </div>
            </div>
        </div>

        <!-- VISTA: ADMIN -->
        <div id="viewAdmin" class="hidden-section max-w-7xl mx-auto p-4 pb-20 animate-fade-in">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-6 gap-4">
                <div>
                    <h2 class="text-2xl md:text-3xl font-black text-blue-900 tracking-tight">Panel de Control</h2>
                    <p class="text-sm text-slate-500 font-medium">Datos en Memoria Local</p>
                </div>
                
                <div class="w-full md:w-auto flex flex-col sm:flex-row gap-3">
                    <div class="bg-blue-50 px-4 py-3 rounded-xl border border-blue-100 flex justify-between sm:block items-center">
                        <span class="text-[10px] font-bold text-blue-400 block uppercase tracking-wider">Ingresos Hoy</span>
                        <span id="totalRecaudado" class="text-xl font-black text-blue-900">0 Gs</span>
                    </div>

                    <div class="flex gap-2">
                        <button onclick="generarDatosPrueba()" id="btnPrueba" class="flex-1 bg-slate-800 text-white px-4 py-2 rounded-xl font-bold text-xs hover:bg-slate-900 flex justify-center items-center gap-2 shadow-lg active:scale-95 transition-transform">
                            +12 Test
                        </button>
                        <button onclick="exportarExcel()" class="flex-1 bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold text-xs hover:bg-emerald-700 flex justify-center items-center gap-2 shadow-lg shadow-emerald-500/20 active:scale-95 transition-transform">
                            Excel
                        </button>
                        <button onclick="borrarDatos()" class="bg-red-100 text-red-600 px-3 py-2 rounded-xl font-bold text-xs hover:bg-red-200">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Tabla/Cards -->
            <div class="bg-transparent md:bg-white md:rounded-2xl md:shadow-lg md:border md:border-slate-200 overflow-hidden">
                <div id="mobileCardsContainer" class="md:hidden space-y-3"></div>
                <div class="hidden md:block overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 text-slate-500 uppercase font-bold text-[10px] tracking-wider">
                            <tr><th class="p-4">Hora</th><th class="p-4">Chapa</th><th class="p-4">Vehículo</th><th class="p-4">Servicio</th><th class="p-4">Insumos (Agua/Sham/Des)</th><th class="p-4 text-right">Monto</th></tr>
                        </thead>
                        <tbody id="tablaRegistros" class="divide-y divide-slate-100 font-medium text-slate-700"></tbody>
                    </table>
                </div>
            </div>
            <div id="emptyState" class="hidden py-12 text-center">
                <div class="bg-white p-8 rounded-2xl shadow-sm inline-block"><p class="text-slate-400 mb-2">Sin registros hoy</p></div>
            </div>
        </div>
    </div>

    <!-- LOGICA PURA LOCAL (NO FIREBASE) -->
    <script>
        // --- CONFIGURACIÓN DE DATOS ---
        let registros = [];
        let tipoSeleccionado = 'Camioneta';
        let servicioSeleccionado = null;
        let adicionalesSeleccionados = [];

        const SERVICIOS = [
            { id: 's1', nombre: 'Ducha superficial', precio: 40000 },
            { id: 's2', nombre: 'Ducha Superficial + Aspirado', precio: 50000 },
            { id: 's3', nombre: 'Ducha Sup. + Asp. + Parte baja', precio: 60000 },
            { id: 's4', nombre: 'Completo + Motor', precio: 65000 },
        ];
        const ADICIONALES = [
            { id: 'a1', nombre: 'Espuma', precio: 5000 },
            { id: 'a2', nombre: 'Cera VONIXX', precio: 20000 },
            { id: 'a3', nombre: 'Recuperador plásticos ext.', precio: 10000 },
            { id: 'a4', nombre: 'Limpieza tapetes (Pana)', precio: 5000 },
        ];
        const CONSUMOS = {
            'Moto': { agua: 40, shampoo: 30, desengrasante: 10 },
            'Auto': { agua: 90, shampoo: 80, desengrasante: 25 },
            'Camioneta': { agua: 140, shampoo: 120, desengrasante: 50 },
            'Camion': { agua: 250, shampoo: 300, desengrasante: 150 },
        };

        // --- SISTEMA DE ALMACENAMIENTO LOCAL ---
        function cargarDatosLocales() {
            const guardado = localStorage.getItem('baez_registros_v1');
            if(guardado) {
                registros = JSON.parse(guardado);
                // Convertir strings de fecha back a objetos Date
                registros = registros.map(r => ({
                    ...r,
                    fechaObj: new Date(r.fechaIso)
                }));
                // Ordenar por más reciente
                registros.sort((a,b) => b.fechaObj - a.fechaObj);
            }
            renderData();
        }

        function guardarDatosLocales() {
            localStorage.setItem('baez_registros_v1', JSON.stringify(registros));
            renderData();
        }

        // --- UI RENDERING ---
        function renderServicios() {
            document.getElementById('serviciosContainer').innerHTML = SERVICIOS.map(s => `
                <div onclick="selectServicio('${s.id}')" 
                     class="relative p-4 rounded-xl border-2 cursor-pointer transition-all flex justify-between items-center ${servicioSeleccionado?.id === s.id ? 'border-cyan-500 bg-cyan-50 ring-2 ring-cyan-100' : 'border-slate-100 hover:bg-slate-50'}"
                     id="serv-${s.id}">
                    <span class="font-bold text-sm ${servicioSeleccionado?.id === s.id ? 'text-blue-900' : 'text-slate-600'}">${s.nombre}</span>
                    <span class="bg-white px-2 py-1 rounded border text-xs font-black text-slate-800">${s.precio.toLocaleString('es-PY')} Gs</span>
                </div>
            `).join('');
        }

        function renderAdicionales() {
            document.getElementById('adicionalesContainer').innerHTML = ADICIONALES.map(a => {
                const isSelected = adicionalesSeleccionados.find(ad => ad.id === a.id);
                return `
                <div onclick="toggleAdicional('${a.id}')" 
                     class="p-3 rounded-xl border cursor-pointer transition-all flex justify-between items-center ${isSelected ? 'bg-slate-800 text-white scale-[1.02]' : 'border-slate-100 bg-white text-slate-500'}"
                     id="adic-${a.id}">
                    <span class="text-xs font-bold">${a.nombre}</span>
                    <span class="text-[10px] font-black ${isSelected ? 'text-cyan-300' : 'text-slate-400'}">+${(a.precio/1000).toFixed(0)}mil</span>
                </div>
            `}).join('');
        }

        window.selectTipo = (tipo) => {
            tipoSeleccionado = tipo;
            document.querySelectorAll('.btn-tipo').forEach(btn => {
                if(btn.dataset.value === tipo) {
                    btn.classList.add('border-cyan-500', 'text-cyan-600', 'bg-cyan-50', 'ring-2');
                    btn.classList.remove('border-slate-200');
                } else {
                    btn.classList.remove('border-cyan-500', 'text-cyan-600', 'bg-cyan-50', 'ring-2');
                    btn.classList.add('border-slate-200');
                }
            });
            calculateTotal();
        };

        window.selectServicio = (id) => {
            servicioSeleccionado = SERVICIOS.find(s => s.id === id);
            renderServicios();
            calculateTotal();
        };

        window.toggleAdicional = (id) => {
            const item = ADICIONALES.find(a => a.id === id);
            if(adicionalesSeleccionados.find(a => a.id === id)) {
                adicionalesSeleccionados = adicionalesSeleccionados.filter(a => a.id !== id);
            } else {
                adicionalesSeleccionados.push(item);
            }
            renderAdicionales();
            calculateTotal();
        };

        function calculateTotal() {
            let total = servicioSeleccionado ? servicioSeleccionado.precio : 0;
            adicionalesSeleccionados.forEach(a => total += a.precio);
            document.getElementById('totalDisplay').innerText = total.toLocaleString('es-PY') + ' Gs';
            return total;
        }

        // --- OPERACIONES ---
        window.guardarRegistro = async () => {
            const chapa = document.getElementById('inputChapa').value.trim();
            if(!chapa) { alert("⚠️ Faltó cargar la CHAPA"); return; }
            if(!servicioSeleccionado) { alert("⚠️ Selecciona un servicio"); return; }
            
            // Vibración simple
            if(navigator.vibrate) try { navigator.vibrate(50); } catch(e){}
            
            setLoading(true);
            
            // Simular carga rápida (UX)
            setTimeout(() => {
                const nuevoRegistro = {
                    id: Date.now(),
                    chapa: chapa.toUpperCase(),
                    tipoVehiculo: tipoSeleccionado,
                    servicioBase: servicioSeleccionado.nombre,
                    adicionales: adicionalesSeleccionados.map(a => a.nombre),
                    total: calculateTotal(),
                    fechaIso: new Date().toISOString(),
                    fechaObj: new Date()
                };

                registros.unshift(nuevoRegistro); // Agregar al inicio
                guardarDatosLocales();
                
                showToast(`✅ Auto ${chapa} registrado`);
                resetForm();
                setLoading(false);
            }, 300);
        };

        window.generarDatosPrueba = () => {
            const batch = [];
            for(let i=0; i<4; i++) {
                for(let j=0; j<3; j++) {
                    const srv = SERVICIOS[Math.floor(Math.random()*SERVICIOS.length)];
                    const fechaSimulada = new Date();
                    fechaSimulada.setMinutes(fechaSimulada.getMinutes() - (i*20 + j*5));
                    
                    batch.push({
                        id: Date.now() + Math.random(),
                        chapa: `TEST-${Math.floor(Math.random()*900)+100}`,
                        tipoVehiculo: ['Moto','Auto','Camioneta','Camion'][i],
                        servicioBase: srv.nombre,
                        adicionales: [],
                        total: srv.precio,
                        fechaIso: fechaSimulada.toISOString(),
                        fechaObj: fechaSimulada
                    });
                }
            }
            registros = [...batch, ...registros];
            registros.sort((a,b) => b.fechaObj - a.fechaObj);
            guardarDatosLocales();
            showToast("12 Datos generados");
        };

        window.borrarDatos = () => {
            if(confirm("¿Borrar todos los datos locales?")) {
                registros = [];
                guardarDatosLocales();
            }
        };

        window.exportarExcel = () => {
            if(registros.length === 0) { alert("Sin datos"); return; }
            
            const headers = ["Fecha", "Hora", "Chapa", "Vehículo", "Servicio", "Adicionales", "Insumos (A/S/D)", "Total Gs"];
            let csv = "\uFEFF" + headers.join(";") + "\n"; 

            registros.forEach(r => {
                const date = r.fechaObj;
                const horaStr = date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0');
                const fechaStr = date.getDate() + '/' + (date.getMonth()+1) + '/' + date.getFullYear();

                const cons = CONSUMOS[r.tipoVehiculo] || {agua:0, shampoo:0, desengrasante:0};
                const multi = (r.servicioBase && (r.servicioBase.includes('Motor') || r.servicioBase.includes('Completo'))) ? 1.3 : 1;
                const insumosStr = `${(cons.agua*multi).toFixed(0)}L / ${(cons.shampoo*multi).toFixed(0)}ml / ${(cons.desengrasante*multi).toFixed(0)}ml`;

                const row = [
                    fechaStr,
                    horaStr,
                    r.chapa || '-',
                    r.tipoVehiculo || '-',
                    `"${r.servicioBase || '-'}"`,
                    `"${(r.adicionales || []).join(', ')}"`,
                    insumosStr,
                    (r.total || 0).toString()
                ];
                csv += row.join(";") + "\n";
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Baez_Reporte_Local_${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // --- UTILIDADES ---
        function resetForm() {
            document.getElementById('inputChapa').value = '';
            adicionalesSeleccionados = [];
            selectServicio(SERVICIOS[0].id);
            renderAdicionales();
        }

        function setLoading(isLoading) {
            const btn = document.getElementById('btnGuardar');
            const txt = document.getElementById('btnText');
            const loader = document.getElementById('btnLoader');
            btn.disabled = isLoading;
            if(isLoading) { txt.classList.add('hidden'); loader.classList.remove('hidden'); }
            else { txt.classList.remove('hidden'); loader.classList.add('hidden'); }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            t.classList.remove('translate-y-[-150%]');
            setTimeout(() => t.classList.add('translate-y-[-150%]'), 3000);
        }

        window.switchView = (view) => {
            const v1 = document.getElementById('viewIngreso');
            const v2 = document.getElementById('viewAdmin');
            const b1 = document.getElementById('btnIngreso');
            const b2 = document.getElementById('btnAdmin');
            if(view === 'ingreso') {
                v1.classList.remove('hidden-section'); v2.classList.add('hidden-section');
                b1.className = "px-3 py-2 rounded-md text-xs md:text-sm font-bold bg-cyan-500 text-white shadow-lg flex items-center gap-2";
                b2.className = "px-3 py-2 rounded-md text-xs md:text-sm font-bold text-blue-300 hover:text-white flex items-center gap-2";
            } else {
                v1.classList.add('hidden-section'); v2.classList.remove('hidden-section');
                b2.className = "px-3 py-2 rounded-md text-xs md:text-sm font-bold bg-cyan-500 text-white shadow-lg flex items-center gap-2";
                b1.className = "px-3 py-2 rounded-md text-xs md:text-sm font-bold text-blue-300 hover:text-white flex items-center gap-2";
            }
        };

        function renderData() {
            const tBody = document.getElementById('tablaRegistros');
            const mCards = document.getElementById('mobileCardsContainer');
            const empty = document.getElementById('emptyState');
            
            if(registros.length === 0) { empty.classList.remove('hidden'); tBody.innerHTML=''; mCards.innerHTML=''; return; }
            empty.classList.add('hidden');

            const totalDia = registros.reduce((acc, curr) => acc + (curr.total || 0), 0);
            document.getElementById('totalRecaudado').innerText = totalDia.toLocaleString('es-PY') + ' Gs';

            mCards.innerHTML = registros.map(r => `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center">
                    <div>
                        <div class="flex items-center gap-2 mb-1"><span class="bg-slate-800 text-white text-[10px] font-bold px-1.5 py-0.5 rounded">${r.chapa}</span><span class="text-xs font-bold text-slate-400">${r.tipoVehiculo}</span></div>
                        <div class="font-bold text-sm text-blue-900 leading-tight">${r.servicioBase}</div>
                    </div>
                    <div class="text-right"><div class="text-lg font-black text-slate-800">${(r.total || 0).toLocaleString('es-PY')}</div><div class="text-[10px] text-slate-400 font-bold">Gs</div></div>
                </div>
            `).join('');

            tBody.innerHTML = registros.map(r => `
                <tr class="hover:bg-blue-50 border-b border-slate-100">
                    <td class="p-4 text-xs font-mono text-slate-500">${r.fechaObj.toLocaleTimeString('es-PY', {hour:'2-digit', minute:'2-digit'})}</td>
                    <td class="p-4"><span class="bg-slate-100 px-2 py-1 rounded font-bold text-xs border">${r.chapa}</span></td>
                    <td class="p-4 text-sm font-medium text-slate-600">${r.tipoVehiculo}</td>
                    <td class="p-4 text-sm text-slate-700 font-semibold">${r.servicioBase}</td>
                    <td class="p-4 text-xs text-slate-400">Calculado en Excel</td>
                    <td class="p-4 text-right font-black text-slate-800">${(r.total || 0).toLocaleString('es-PY')} Gs</td>
                </tr>
            `).join('');
        }

        // --- INICIO ---
        selectServicio(SERVICIOS[0].id);
        renderAdicionales();
        cargarDatosLocales();

    </script>
</body>
</html>
